x-sentinel: &sentinel
  image: redis:7.4-alpine
  depends_on: [redis-master, redis-replica]
  command:
    - sh
    - -c
    - |
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel resolve-hostnames yes
      sentinel announce-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf

services:
  # ------------------------------------------------------------- databases
  flight-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: flight, POSTGRES_USER: flight, POSTGRES_PASSWORD: flight }
    ports: ["5441:5432"]
    volumes: [flight-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 2s
      retries: 30

  booking-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: booking, POSTGRES_USER: booking, POSTGRES_PASSWORD: booking }
    ports: ["5442:5432"]
    volumes: [booking-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      retries: 30

  flight-migrations:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://flight-db:5432/flight -user=flight -password=flight -connectRetries=30 migrate
    volumes: [./flight-service/db/migration:/flyway/sql:ro]
    depends_on:
      flight-db: { condition: service_healthy }

  booking-migrations:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://booking-db:5432/booking -user=booking -password=booking -connectRetries=30 migrate
    volumes: [./booking-service/db/migration:/flyway/sql:ro]
    depends_on:
      booking-db: { condition: service_healthy }

  # ------------------------------------------- redis: master + replica + 3 sentinels
  redis-master:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --replica-announce-ip redis-master

  redis-replica:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --replicaof redis-master 6379 --replica-announce-ip redis-replica
    depends_on: [redis-master]

  redis-sentinel-1: *sentinel
  redis-sentinel-2: *sentinel
  redis-sentinel-3: *sentinel

  # -------------------------------------------------------------- services
  flight-service:
    build: { context: ., dockerfile: flight-service/Dockerfile }
    environment:
      DATABASE_URL: postgresql://flight:flight@flight-db:5432/flight
      FLIGHT_SERVICE_API_KEYS: ${FLIGHT_SERVICE_API_KEY:-dev-flight-api-key}
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports: ["50051:50051"]
    depends_on:
      flight-migrations: { condition: service_completed_successfully }
      redis-sentinel-1: { condition: service_started }
      redis-sentinel-2: { condition: service_started }
      redis-sentinel-3: { condition: service_started }

  booking-service:
    build: { context: ., dockerfile: booking-service/Dockerfile }
    environment:
      DATABASE_URL: postgresql://booking:booking@booking-db:5432/booking
      FLIGHT_SERVICE_ADDR: flight-service:50051
      FLIGHT_SERVICE_API_KEY: ${FLIGHT_SERVICE_API_KEY:-dev-flight-api-key}
      GRPC_TIMEOUT_SECONDS: ${GRPC_TIMEOUT_SECONDS:-2}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-100}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_WINDOW_SECONDS: ${CB_WINDOW_SECONDS:-30}
      CB_OPEN_TIMEOUT_SECONDS: ${CB_OPEN_TIMEOUT_SECONDS:-15}
    ports: ["8081:8080"]
    depends_on:
      booking-migrations: { condition: service_completed_successfully }
      flight-service: { condition: service_healthy }

volumes:
  flight-db-data:
  booking-db-data:
