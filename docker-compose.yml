services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://postgres:5432/marketplace -user=marketplace -password=marketplace -connectRetries=30 migrate
    volumes:
      - ./marketplace-service/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  marketplace-service:
    build: ./marketplace-service
    environment:
      DATABASE_URL: postgresql+psycopg://marketplace:marketplace@postgres:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-bytes-minimum!!}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ORDER_RATE_LIMIT_MINUTES: ${ORDER_RATE_LIMIT_MINUTES:-1}
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  pgdata:
