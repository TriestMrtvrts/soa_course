openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: |
    API маркетплейса: каталог товаров, заказы, промокоды, аутентификация.

    **Авторизация.** Все эндпоинты, кроме `/auth/*` и `/health`, требуют заголовок
    `Authorization: Bearer <access_token>`. Роль пользователя передаётся в claim `role`
    access-токена (`USER`, `SELLER`, `ADMIN`).
    Допустимые роли операции перечислены в расширении `x-roles` (и в её описании);
    сгенерированный роутер проверяет их до вызова бизнес-логики (`403 ACCESS_DENIED`).
    Проверки владения (SELLER — только свои товары, USER — только свои заказы) выполняет сервис.

    **Ошибки.** Любая ошибка возвращается в едином формате `ErrorResponse`
    (`error_code`, `message`, `details`).

    | error_code | HTTP | Когда |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | Ошибка валидации входных данных |
    | `TOKEN_INVALID` | 401 | Access token отсутствует, повреждён или не того типа |
    | `TOKEN_EXPIRED` | 401 | Access token просрочен |
    | `REFRESH_TOKEN_INVALID` | 401 | Refresh token невалиден или просрочен |
    | `INVALID_CREDENTIALS` | 401 | Неверный email или пароль |
    | `ACCESS_DENIED` | 403 | Недостаточно прав для операции |
    | `ORDER_OWNERSHIP_VIOLATION` | 403 | Заказ принадлежит другому пользователю |
    | `PRODUCT_NOT_FOUND` | 404 | Товар не найден по ID |
    | `ORDER_NOT_FOUND` | 404 | Заказ не найден по ID |
    | `NOT_FOUND` | 404 | Неизвестный путь |
    | `PRODUCT_INACTIVE` | 409 | Попытка заказать неактивный товар |
    | `ORDER_HAS_ACTIVE` | 409 | У пользователя уже есть активный заказ |
    | `INVALID_STATE_TRANSITION` | 409 | Недопустимый переход состояния заказа |
    | `INSUFFICIENT_STOCK` | 409 | Недостаточно товара на складе |
    | `USER_ALREADY_EXISTS` | 409 | Email уже зарегистрирован |
    | `PROMO_CODE_ALREADY_EXISTS` | 409 | Промокод с таким кодом уже существует |
    | `PROMO_CODE_INVALID` | 422 | Промокод не найден, истёк, исчерпан или неактивен |
    | `PROMO_CODE_MIN_AMOUNT` | 422 | Сумма заказа ниже минимальной для промокода |
    | `ORDER_LIMIT_EXCEEDED` | 429 | Превышен лимит частоты создания/обновления заказа |
    | `INTERNAL_ERROR` | 500 | Непредвиденная ошибка сервера |
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: products
  - name: orders
  - name: promo-codes
  - name: system

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Проверка живости сервиса
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя (роль USER или SELLER)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация, возвращает access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновление access token по refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -------------------------------------------------------------- products
  /products:
    post:
      tags: [products]
      operationId: create_product
      x-roles: [SELLER, ADMIN]
      summary: Создание товара
      description: |
        Роли: `SELLER` (товар привязывается к продавцу через `seller_id`), `ADMIN`.
        `USER` — `403 ACCESS_DENIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [products]
      operationId: list_products
      x-roles: [USER, SELLER, ADMIN]
      summary: Список товаров с пагинацией и фильтрацией
      description: 'Роли: `USER`, `SELLER`, `ADMIN` — все товары.'
      parameters:
        - name: page
          in: query
          description: Номер страницы, начиная с 0
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          description: Категория, точное совпадение
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [products]
      operationId: get_product
      x-roles: [USER, SELLER, ADMIN]
      summary: Получение товара по ID
      description: 'Роли: `USER`, `SELLER`, `ADMIN` — любой товар.'
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: update_product
      x-roles: [SELLER, ADMIN]
      summary: Обновление товара
      description: |
        Частичное обновление: изменяются только переданные поля (минимум одно).
        Роли: `SELLER` — только свои товары, `ADMIN` — любые. `USER` — `403 ACCESS_DENIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Обновлённый товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [products]
      operationId: delete_product
      x-roles: [SELLER, ADMIN]
      summary: Мягкое удаление (перевод в статус ARCHIVED)
      description: 'Роли: `SELLER` — только свои товары, `ADMIN` — любые. `USER` — `403 ACCESS_DENIED`.'
      responses:
        '200':
          description: Товар переведён в ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- orders
  /orders:
    post:
      tags: [orders]
      operationId: create_order
      x-roles: [USER, ADMIN]
      summary: Создание заказа
      description: |
        Роли: `USER`, `ADMIN`. `SELLER` — `403 ACCESS_DENIED`.

        Проверки выполняются последовательно: лимит частоты (`ORDER_LIMIT_EXCEEDED`) →
        активный заказ (`ORDER_HAS_ACTIVE`) → каталог (`PRODUCT_NOT_FOUND` / `PRODUCT_INACTIVE`) →
        остатки (`INSUFFICIENT_STOCK`) → промокод (`PROMO_CODE_INVALID` / `PROMO_CODE_MIN_AMOUNT`).
        Резервирование остатков и создание заказа выполняются в одной транзакции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PromoCodeError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [orders]
      operationId: get_order
      x-roles: [USER, ADMIN]
      summary: Получение заказа по ID
      description: 'Роли: `USER` — только свои, `ADMIN` — любые. `SELLER` — `403 ACCESS_DENIED`.'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [orders]
      operationId: update_order
      x-roles: [USER, ADMIN]
      summary: Обновление позиций заказа
      description: |
        Роли: `USER` — только свои, `ADMIN` — любые. `SELLER` — `403 ACCESS_DENIED`.

        Проверки: владелец (`ORDER_OWNERSHIP_VIOLATION`) → состояние `CREATED`
        (`INVALID_STATE_TRANSITION`) → лимит частоты (`ORDER_LIMIT_EXCEEDED`). Затем старые
        остатки возвращаются, новые позиции проверяются и резервируются, стоимость и скидка
        пересчитываются — всё в одной транзакции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Обновлённый заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [orders]
      operationId: cancel_order
      x-roles: [USER, ADMIN]
      summary: Отмена заказа
      description: |
        Роли: `USER` — только свои, `ADMIN` — любые. `SELLER` — `403 ACCESS_DENIED`.
        Разрешена только из `CREATED` и `PAYMENT_PENDING`. Остатки и использование
        промокода возвращаются в одной транзакции.
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [orders]
      operationId: change_order_status
      x-roles: [USER, ADMIN]
      summary: Перевод заказа в следующее состояние
      description: |
        Модель состояний:
        `CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED`,
        `CREATED | PAYMENT_PENDING → CANCELED`.

        Роли: `USER` — только для своих заказов и только `CREATED → PAYMENT_PENDING`
        (оформление к оплате); `ADMIN` — любой допустимый переход. `SELLER` — `403 ACCESS_DENIED`.
        Переход в `CANCELED` выполняется через `POST /orders/{id}/cancel`.
        Недопустимый переход — `409 INVALID_STATE_TRANSITION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Заказ в новом состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ----------------------------------------------------------- promo codes
  /promo-codes:
    post:
      tags: [promo-codes]
      operationId: create_promo_code
      x-roles: [SELLER, ADMIN]
      summary: Создание промокода
      description: 'Роли: `SELLER`, `ADMIN`. `USER` — `403 ACCESS_DENIED`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (TTL 15 минут) из `/auth/login` или `/auth/refresh`.
        Claims: `sub` (user id), `role` (`USER` | `SELLER` | `ADMIN`), `type` = `access`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR` — невалидные входные данные; `details.errors` содержит список нарушений'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: VALIDATION_ERROR
            message: Request validation failed
            details:
              errors:
                - field: body.price
                  message: Input should be greater than or equal to 0.01
                  type: greater_than_equal
    Unauthorized:
      description: '`TOKEN_INVALID`, `TOKEN_EXPIRED`, `REFRESH_TOKEN_INVALID`, `INVALID_CREDENTIALS`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: '`ACCESS_DENIED`, `ORDER_OWNERSHIP_VIOLATION`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`PRODUCT_NOT_FOUND`, `ORDER_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: '`PRODUCT_INACTIVE`, `ORDER_HAS_ACTIVE`, `INVALID_STATE_TRANSITION`, `INSUFFICIENT_STOCK`, `USER_ALREADY_EXISTS`, `PROMO_CODE_ALREADY_EXISTS`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: INSUFFICIENT_STOCK
            message: Insufficient stock for one or more products
            details:
              items:
                - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  requested: 10
                  available: 2
    PromoCodeError:
      description: '`PROMO_CODE_INVALID`, `PROMO_CODE_MIN_AMOUNT`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: '`ORDER_LIMIT_EXCEEDED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ------------------------------------------------------------ common
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          description: Машиночитаемый код ошибки
          example: PRODUCT_NOT_FOUND
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные (опционально)
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # -------------------------------------------------------------- auth
    Role:
      type: string
      enum: [USER, SELLER, ADMIN]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          description: Самостоятельно можно зарегистрироваться только как USER или SELLER
          enum: [USER, SELLER]
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Время жизни access token в секундах
    UserResponse:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    # ---------------------------------------------------------- products
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    ProductCreate:
      type: object
      additionalProperties: false
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          multipleOf: 0.01
          minimum: 0.01
          maximum: 9999999999.99
          description: Цена (строго > 0, минимум 0.01)
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Частичное обновление — передаются только изменяемые поля
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
          description: '`null` очищает описание'
        price:
          type: number
          format: decimal
          multipleOf: 0.01
          minimum: 0.01
          maximum: 9999999999.99
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductResponse:
      type: object
      required: [id, name, description, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    # ------------------------------------------------------------ orders
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
    OrderItemRequest:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    OrderCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          nullable: true
          pattern: '^[A-Z0-9_]{4,20}$'
    OrderUpdate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price_at_order:
          type: number
          format: decimal
    OrderResponse:
      type: object
      required: [id, user_id, status, items, total_amount, discount_amount, promo_code, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        total_amount:
          type: number
          format: decimal
          description: Итоговая сумма с учётом скидки
        discount_amount:
          type: number
          format: decimal
        promo_code:
          type: string
          nullable: true
          description: Применённый промокод
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------- promo codes
    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]
    PromoCodeCreate:
      type: object
      additionalProperties: false
      required: [code, discount_type, discount_value, max_uses, valid_from, valid_until]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
          multipleOf: 0.01
          minimum: 0.01
          maximum: 9999999999.99
          description: Процент (для PERCENTAGE, не более 100) или фиксированная сумма
        min_order_amount:
          type: number
          format: decimal
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999.99
          default: 0
        max_uses:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true
    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
        min_order_amount:
          type: number
          format: decimal
        max_uses:
          type: integer
        current_uses:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
